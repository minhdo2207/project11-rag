# Cau hinh pipeline. Bat/tat tung tang de lam ablation (do dong gop cua moi tang).
# Doi backend / model chi can sua o day, khong dong vao code.

storage:
  backend: file          # memory | file | qdrant
  path: data/kb          # dung cho backend = file hoac qdrant (local)

embedding:
  provider: ollama       # ollama | hashing (hashing: offline, khong co ngu nghia, de test/demo)
  model: bge-m3          # ollama pull bge-m3 (hoac nomic-embed-text, Qwen3-Embedding)
  dim: 1024              # chi dung cho provider = hashing

# Cac tang cua pipeline RAG - bat dan tung cai khi implement xong
pipeline:
  chunking: naive        # naive | cast
  retrieval: vector      # vector | hybrid
  rerank: false
  mode: rag              # no_rag | rag | rag_fewshot
  verify: false          # bat LettuceDetect kiem chung bang chung

retrieval:
  top_k: 5
  rerank_top_k: 3
  score_threshold: 0.0   # duoi nguong nay thi bo (rerank moi dung toi)

llm:
  provider: ollama
  model: qwen2.5:7b      # ollama pull qwen2.5:7b
  temperature: 0.1
  max_tokens: 512        # de rong de tranh cat cut cau tra loi (bai hoc tu seminar CRAG)
